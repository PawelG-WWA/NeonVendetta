<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON VENDETTA</title>
<link rel="icon" href="data:,">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #050508;
  overflow: hidden;
}

body {
  font-family: 'Courier New', Courier, monospace;
  font-weight: bold;
  color: #7dfcff;
  user-select: none;
}

#game-root {
  position: fixed;
  inset: 0;
  z-index: 0;
}

#ui-root {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

.menu {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 42px;
  background: radial-gradient(ellipse at center, #101024 0%, #050508 70%);
  pointer-events: auto;
}

.menu-logo {
  width: 600px;
  max-width: 88vw;
  height: auto;
  image-rendering: pixelated;
  filter: drop-shadow(0 0 24px rgba(255, 45, 149, 0.45));
}

.start-button {
  font-family: inherit;
  font-weight: bold;
  font-size: 26px;
  letter-spacing: 8px;
  text-transform: uppercase;
  color: #7dfcff;
  background: #0a0a16;
  padding: 16px 48px;
  border: 4px solid #7dfcff;
  box-shadow: 0 0 0 4px #050508, 0 0 0 8px #1c3f4d, 0 0 28px rgba(125, 252, 255, 0.35);
  cursor: pointer;
}

.start-button::before {
  content: '\25B6\00A0 ';
  animation: blink 1s steps(2, start) infinite;
}

.start-button:hover,
.start-button:focus-visible {
  background: #7dfcff;
  color: #050508;
  outline: none;
  box-shadow: 0 0 0 4px #050508, 0 0 0 8px #7dfcff, 0 0 36px rgba(125, 252, 255, 0.8);
}

.start-button:active {
  transform: translate(2px, 2px);
}

@keyframes blink {
  50% { opacity: 0; }
}

.best-score {
  font-size: 20px;
  letter-spacing: 6px;
  color: #ffe74a;
  text-shadow: 0 0 10px rgba(255, 231, 74, 0.7);
}

.play-hint {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 32px;
  text-align: center;
  font-size: 14px;
  letter-spacing: 4px;
  color: rgba(125, 252, 255, 0.35);
  pointer-events: none;
}

.scanlines {
  position: fixed;
  inset: 0;
  z-index: 30;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0px, rgba(0, 0, 0, 0.22) 2px, transparent 2px, transparent 4px);
}

.hud {
  position: absolute;
  top: 18px;
  left: 24px;
  pointer-events: none;
}

.hud-score {
  font-size: 24px;
  letter-spacing: 6px;
  color: #7dfcff;
  background: rgba(5, 5, 8, 0.72);
  border: 3px solid #1c3f4d;
  padding: 8px 14px;
  text-shadow: 2px 2px 0 #050508, 0 0 12px rgba(125, 252, 255, 0.55);
}

.hud-kills {
  margin-top: 10px;
  font-size: 18px;
  letter-spacing: 6px;
  color: #ffe74a;
  background: rgba(5, 5, 8, 0.72);
  border: 3px solid #1c3f4d;
  padding: 6px 12px;
  text-shadow: 2px 2px 0 #050508, 0 0 10px rgba(255, 231, 74, 0.55);
}

.game-over {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  background: rgba(5, 5, 8, 0.82);
  pointer-events: none;
}

.game-over-title {
  font-size: 64px;
  letter-spacing: 16px;
  color: #ff2d55;
  text-shadow: 0 0 24px rgba(255, 45, 85, 0.8), 3px 3px 0 #050508;
}

.game-over-score {
  font-size: 26px;
  letter-spacing: 8px;
  color: #7dfcff;
  text-shadow: 0 0 12px rgba(125, 252, 255, 0.6);
}

.game-over-best {
  font-size: 20px;
  letter-spacing: 6px;
  color: #ffe74a;
  text-shadow: 0 0 10px rgba(255, 231, 74, 0.7);
}

.game-over-hint {
  font-size: 16px;
  letter-spacing: 6px;
  color: rgba(125, 252, 255, 0.6);
  animation: blink 1s steps(2, start) infinite;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="game-root"></div>
<div id="ui-root"></div>
<div class="scanlines"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
